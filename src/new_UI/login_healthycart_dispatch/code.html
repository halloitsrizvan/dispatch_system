<style>
        .ecg-line {
            stroke-dasharray: 1000;
            stroke-dashoffset: 1000;
            animation: dash 5s linear infinite;
            opacity: 0.15;
        }
        @keyframes dash {
            to { stroke-dashoffset: 0; }
        }
        .spinner {
            border: 2px solid rgba(0, 0, 0, 0.1);
            border-left-color: #000;
            border-radius: 50%;
            width: 16px;
            height: 16px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

<body class="bg-[#0D1117] min-h-screen flex items-center justify-center relative overflow-hidden font-body-regular text-on-surface">
<!-- Background ECG Decoration -->
<div class="absolute inset-0 z-0 flex items-center justify-center pointer-events-none">
<svg class="ecg-line" fill="none" height="200" viewbox="0 0 1000 200" width="100%" xmlns="http://www.w3.org/2000/svg">
<path d="M0 100H200L220 70L250 130L270 100H400L420 20L450 180L480 100H650L670 85L690 115L710 100H1000" stroke="#00C896" stroke-width="1.5"></path>
</svg>
</div>
<!-- Main Login Container -->
<main class="relative z-10 w-full max-w-[420px] px-md">
<div class="bg-[#161B22] border border-[#30363D] shadow-[0_0_24px_rgba(0,200,150,0.05)] rounded-lg overflow-hidden">
<!-- Branding Header -->
<div class="px-xl pt-xl pb-lg text-center">
<div class="flex items-center justify-center gap-xs mb-sm">
<span class="material-symbols-outlined text-primary-container text-3xl" style="font-variation-settings: 'FILL' 1;">ecg_heart</span>
<h1 class="font-h1-technical text-h1-technical text-primary-container tracking-tighter">HEALTHYCART</h1>
</div>
<p class="font-ui-label-bold text-ui-label-bold text-outline-variant uppercase tracking-widest">Dispatch Center</p>
</div>
<!-- Login Form -->
<form class="px-xl pb-xl space-y-md">
<!-- Status/Access Message -->
<div class="bg-surface-container-low border-l-2 border-primary-container p-sm mb-lg flex items-center gap-sm">
<span class="material-symbols-outlined text-primary-container text-[18px]">lock_person</span>
<span class="font-ui-label-standard text-ui-label-standard text-on-surface-variant">Dispatcher or Admin access only</span>
</div>
<!-- Input Groups -->
<div class="space-y-sm">
<div class="space-y-xs">
<label class="font-ui-label-bold text-ui-label-bold text-outline-variant" for="email">SYSTEM EMAIL</label>
<div class="relative group">
<span class="absolute left-md top-1/2 -translate-y-1/2 material-symbols-outlined text-slate-500 text-[18px] group-focus-within:text-primary-container">mail</span>
<input class="w-full bg-[#0D1117] border-[#30363D] text-on-surface font-body-regular text-body-regular pl-xl pr-md py-sm rounded focus:ring-1 focus:ring-primary-container focus:border-primary-container transition-all outline-none" id="email" placeholder="admin@healthycart.dispatch" type="email"/>
</div>
</div>
<div class="space-y-xs">
<label class="font-ui-label-bold text-ui-label-bold text-outline-variant" for="password">ACCESS TOKEN</label>
<div class="relative group">
<span class="absolute left-md top-1/2 -translate-y-1/2 material-symbols-outlined text-slate-500 text-[18px] group-focus-within:text-primary-container">key</span>
<input class="w-full bg-[#0D1117] border-[#30363D] text-on-surface font-body-regular text-body-regular pl-xl pr-md py-sm rounded focus:ring-1 focus:ring-primary-container focus:border-primary-container transition-all outline-none" id="password" placeholder="••••••••••••" type="password"/>
</div>
</div>
</div>
<!-- Action Button -->
<button class="w-full bg-primary-container hover:bg-primary py-md rounded font-ui-label-bold text-ui-label-bold text-on-primary-container flex items-center justify-center gap-sm transition-all active:scale-[0.98] shadow-[0_0_12px_rgba(0,200,150,0.2)]" type="submit">
<div class="spinner"></div>
                    AUTHENTICATING...
                </button>
<!-- Footer Links -->
<div class="pt-sm flex justify-between items-center font-ui-label-standard text-ui-label-standard text-slate-500">
<a class="hover:text-primary-container transition-colors" href="#">Emergency Reset</a>
<a class="hover:text-primary-container transition-colors" href="#">V6.2 Support</a>
</div>
</form>
</div>
<!-- System Meta Info -->
<div class="mt-lg text-center">
<p class="font-body-regular text-[10px] text-outline-variant uppercase tracking-[0.2em]">
                Secure Terminal Node: HC-092-DELTA
            </p>
<div class="flex justify-center gap-md mt-sm opacity-40">
